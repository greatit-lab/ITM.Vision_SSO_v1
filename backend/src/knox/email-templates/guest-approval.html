<!doctype html>
<!-- /backend/src/knox/email-templates/guest-approval.html -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: #f5f5f5;
    "
  >
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td style="padding: 40px 0">
          <table
            role="presentation"
            style="
              max-width: 600px;
              margin: 0 auto;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  padding: 10px 36px;
                  text-align: center;
                  border-bottom: 1px solid #e9ecef;
                "
              >
                <table role="presentation" style="margin: 0 auto">
                  <tr>
                    <td style="vertical-align: middle; padding-right: 12px">
                      <img
                        src="{logoIconUrl}"
                        alt="I:Vision"
                        width="56"
                        height="56"
                        style="display: block; width: 56px; height: 56px"
                      />
                    </td>
                    <td style="vertical-align: middle">
                      <img
                        src="{logoTextUrl}"
                        alt="I:Vision"
                        height="26"
                        style="display: block; height: 26px"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- Body -->
            <tr>
              <td style="padding: 32px 36px">
                <p style="margin: 0 0 16px; font-size: 15px; color: #666666">
                  게스트 접근 권한 신청이
                  <b style="color: #0f9d58">승인</b>되었습니다.
                </p>
                <table
                  role="presentation"
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    margin-bottom: 20px;
                    background-color: #f8fafc;
                    border: 1px solid #e2e8f0;
                    border-radius: 8px;
                    overflow: hidden;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666666;
                        width: 100px;
                        font-weight: 700;
                        border-bottom: 1px solid #e2e8f0;
                      "
                    >
                      계정 ID
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #1e293b;
                        font-weight: 700;
                        border-bottom: 1px solid #e2e8f0;
                      "
                    >
                      {loginId}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666666;
                        font-weight: 700;
                        border-bottom: 1px solid #e2e8f0;
                        vertical-align: top;
                      "
                    >
                      부여된 권한
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #334155;
                        border-bottom: 1px solid #e2e8f0;
                      "
                    >
                      <span
                        style="
                          display: inline-block;
                          padding: 3px 10px;
                          margin-bottom: 6px;
                          border-radius: 4px;
                          font-size: 12px;
                          font-weight: 700;
                          letter-spacing: 0.03em;
                          color: __roleBadgeTextColor__;
                          background-color: __roleBadgeBgColor__;
                          border: 1px solid __roleBadgeBorderColor__;
                        "
                      >
                        {roleBadgeText}
                      </span>
                      <div
                        style="
                          font-size: 13px;
                          color: #64748b;
                          line-height: 1.5;
                        "
                      >
                        {roleDescription}
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666666;
                        font-weight: 700;
                        vertical-align: top;
                      "
                    >
                      유효기간
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #334155;
                      "
                    >
                      <span style="font-weight: 700; color: #1e293b"
                        >{validUntil}</span
                      >
                      까지
                      <div
                        style="
                          margin-top: 6px;
                          font-size: 13px;
                          color: #64748b;
                          line-height: 1.5;
                        "
                      >
                        위 기간이 만료되면 접근 권한이 자동으로 해제됩니다. 계속
                        이용을 원하시면 만료 전에 재신청해 주세요.
                      </div>
                    </td>
                  </tr>
                </table>
                <table
                  role="presentation"
                  style="width: 100%; text-align: center"
                >
                  <tr>
                    <td>
                      <a
                        href="{link}"
                        style="
                          display: inline-block;
                          padding: 12px 32px;
                          background-color: #1a73e8;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 6px;
                          font-size: 14px;
                          font-weight: 600;
                        "
                        >I:Vision 바로가기</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  background-color: #f8f9fa;
                  padding: 20px 36px;
                  text-align: center;
                  border-top: 1px solid #e9ecef;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #999999">
                  I:Vision 시스템에서 자동 발송된 메일입니다.<br />
                  문의사항은 관리자에게 연락해 주세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
