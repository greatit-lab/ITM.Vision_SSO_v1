<!doctype html>
<!-- /backend/src/knox/email-templates/guest-rejection.html -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: #f5f5f5;
    "
  >
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td style="padding: 40px 0">
          <table
            role="presentation"
            style="
              max-width: 600px;
              margin: 0 auto;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #ea4335, #c5221f);
                  padding: 30px;
                  text-align: center;
                "
              >
                <h1
                  style="
                    margin: 0;
                    color: #ffffff;
                    font-size: 24px;
                    font-weight: 600;
                  "
                >
                  I:Vision
                </h1>
                <p
                  style="
                    margin: 8px 0 0;
                    color: rgba(255, 255, 255, 0.8);
                    font-size: 14px;
                  "
                >
                  게스트 접근 거절
                </p>
              </td>
            </tr>
            <!-- Body -->
            <tr>
              <td style="padding: 30px">
                <p style="margin: 0 0 20px; font-size: 16px; color: #333333">
                  I:Vision 게스트 접근이 거절되었습니다.
                </p>
                <table
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    margin-bottom: 24px;
                    background-color: #f8f9fa;
                    border-radius: 6px;
                    overflow: hidden;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666;
                        width: 100px;
                        font-weight: 600;
                        border-bottom: 1px solid #e9ecef;
                      "
                    >
                      계정 ID
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #333;
                        border-bottom: 1px solid #e9ecef;
                      "
                    >
                      {loginId}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666;
                        font-weight: 600;
                        border-bottom: 1px solid #e9ecef;
                      "
                    >
                      신청 사유
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #333;
                        border-bottom: 1px solid #e9ecef;
                      "
                    >
                      {reason}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666;
                        font-weight: 600;
                      "
                    >
                      처리자
                    </td>
                    <td
                      style="padding: 12px 16px; font-size: 14px; color: #333"
                    >
                      {rejectorName}
                    </td>
                  </tr>
                </table>
                <p style="margin: 0; font-size: 14px; color: #666">
                  문의사항은 관리자에게 연락해 주세요.
                </p>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  background-color: #f8f9fa;
                  padding: 20px 30px;
                  text-align: center;
                  border-top: 1px solid #e9ecef;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #999999">
                  I:Vision 시스템에서 자동 발송된 메일입니다.<br />
                  문의사항은 관리자에게 연락해 주세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
