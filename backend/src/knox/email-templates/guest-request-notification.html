<!doctype html>
<!-- /backend/src/knox/email-templates/guest-request-notification.html -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: #f5f5f5;
    "
  >
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td style="padding: 40px 0">
          <table
            role="presentation"
            style="
              max-width: 600px;
              margin: 0 auto;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  padding: 10px 36px;
                  text-align: center;
                  border-bottom: 1px solid #e9ecef;
                "
              >
                <table role="presentation" style="margin: 0 auto">
                  <tr>
                    <td style="vertical-align: middle: padding-right: 12px">
                      <img
                        src="{logoIconUrl}"
                        alt="I:Vision"
                        width="56"
                        height="56"
                        style="display: block; width: 56px; height: 56"
                      />
                    </td>
                    <td style="vertical-align: middle">
                      <img
                        src="{logoTextUrl}"
                        alt="I:Vision"
                        height="26"
                        style="display: block; height:26px"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- Body -->
            <tr>
              <td style="padding: 32px 36px">
                <p style="margin: 0 0 16px; font-size: 15px; color: #666666">
                  새로운 게스트 접근 권한 신청이 접수되었습니다.
                </p>
                <table
                  role="presentation"
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    margin-bottom: 24px;
                    background-color: #f8fafc;
                    border: 1px solid #e2e8f0;
                    border-radius: 8px;
                    overflow: hidden;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666666;
                        width: 100px;
                        font-weight: 700;
                        border-bottom: 1px solid #e2e8f0;
                      "
                    >
                      계정 ID(신청자이름)
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #1e293b;
                        font-weight: 700;
                        border-bottom: 1px solid #e2e8f0;
                      "
                    >
                      {loginId}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666666;
                        font-weight: 700;
                        border-bottom: 1px solid #e2e8f0;
                      "
                    >
                      부서
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #334155;
                        border-bottom: 1px solid #e2e8f0;
                      "
                    >
                      {deptName}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #666666;
                        font-weight: 700;
                        vertical-align: top;
                      "
                    >
                      신청 사유
                    </td>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        line-height: 1.7;
                        color: #334155"
                        word-break: break-word;
                        min-height: 60px
                        vertical-align: top;
                      "
                    >
                      {div style="min-height: 60px">{reasonHtm}</div>
                    </td>
                  </tr>
                </table>
                <table
                  role="presentation"
                  style="width: 100%; text-align: center"
                >
                  <tr>
                    <td>
                      <a
                        href="{link}"
                        style="
                          display: inline-block;
                          padding: 12px 32px;
                          background-color: #1a73e8;
                          color: #ffffff;
                          text-decoration: none;
                          border-radius: 6px;
                          font-size: 14px;
                          font-weight: 600;
                        "
                        >신청 확인하기</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  background-color: #f8f9fa;
                  padding: 20px 36px;
                  text-align: center;
                  border-top: 1px solid #e9ecef;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #999999">
                  I:Vision 시스템에서 자동 발송된 메일입니다.<br />
                  문의사항은 관리자에게 연락해 주세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
